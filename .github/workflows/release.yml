name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Validate tag and package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version="$(PYTHONPATH=src python -m codex_armada version)"
          test "v${version}" = "${GITHUB_REF_NAME}"

      - name: Run release verification with live upstream validation
        shell: bash
        run: |
          python scripts/verify_release.py \
            --live-upstream \
            --artifact-dir "${RUNNER_TEMP}/verification" \
            --results "${RUNNER_TEMP}/TEST-RESULTS.txt"

      - name: Build release artifacts twice
        shell: bash
        run: |
          wheel="$(find "${RUNNER_TEMP}/verification/wheel" -maxdepth 1 -name '*.whl' -print -quit)"
          python scripts/build_release.py \
            --output-dir "${RUNNER_TEMP}/release-a" \
            --wheel "$wheel" \
            --test-results "${RUNNER_TEMP}/TEST-RESULTS.txt"
          python scripts/build_release.py \
            --output-dir "${RUNNER_TEMP}/release-b" \
            --wheel "$wheel" \
            --test-results "${RUNNER_TEMP}/TEST-RESULTS.txt"
          source_a="$(find "${RUNNER_TEMP}/release-a" -maxdepth 1 -name '*-source.zip' -print -quit)"
          source_b="$(find "${RUNNER_TEMP}/release-b" -maxdepth 1 -name '*-source.zip' -print -quit)"
          test "$(sha256sum "$source_a" | cut -d' ' -f1)" = "$(sha256sum "$source_b" | cut -d' ' -f1)"
          rm -rf dist
          cp -R "${RUNNER_TEMP}/release-a" dist

      - name: Upload release assets to workflow run
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: codex-armada-${{ github.ref_name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release create "${GITHUB_REF_NAME}" dist/* --verify-tag --generate-notes --title "Codex Armada ${GITHUB_REF_NAME}"
