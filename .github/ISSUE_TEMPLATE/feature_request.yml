name: Feature request
description: Propose a bounded improvement to routing, verification, safety, or usability.
title: "feat: "
labels: [enhancement, triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user-visible limitation exists today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest observable outcome and acceptance evidence.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and trade-offs
  - type: dropdown
    id: risk
    attributes:
      label: Expected risk area
      options: [Low, Medium, High, Critical, Unsure]
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: Scope confirmation
      options:
        - label: This request does not depend on a private repository or product-specific workflow.
          required: true
