name: Bug report
description: Report reproducible Codex Armada behavior that differs from the documented contract.
title: "bug: "
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve Codex Armada. Remove credentials and proprietary source from all evidence.
  - type: input
    id: version
    attributes:
      label: Codex Armada version
      placeholder: 1.0.0
    validations:
      required: true
  - type: input
    id: codex
    attributes:
      label: Codex version
      placeholder: Output of codex --version
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Linux, macOS, Windows, Other]
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include commands, sanitized configuration, and the smallest repository fixture that reproduces the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and evidence
      description: Include sanitized output, run status, and relevant report excerpts.
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety confirmation
      options:
        - label: I removed secrets, tokens, private source, personal data, and proprietary prompts.
          required: true
